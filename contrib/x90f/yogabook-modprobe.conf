# Yoga Book YB1-X90F: drivers that cannot work on this board.
# Installed as /etc/modprobe.d/yogabook-quirks.conf.

# snd-pcsp and pcspkr both register a platform driver named "pcspkr" for the
# single x86 "pcspkr" device, so whichever loads second fails with
# "Driver 'pcspkr' is already registered, aborting...". Keep pcspkr.
blacklist snd_pcsp

# lpc_ich creates an "intel-spi" cell for the BIOS flash, but this flash
# descriptor's component density (FLCOMP C0DEN 0xc) is not one spi-intel
# supports, so its probe always fails with -EINVAL. Nothing here needs MTD
# access to the firmware flash.
blacklist spi_intel_platform
