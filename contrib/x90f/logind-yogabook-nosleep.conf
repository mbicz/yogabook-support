# Yoga Book X90F: keep the machine reachable from the network while it is being
# worked on, and stop the power button from powering the machine off.
#
# 2026-10-18: a logind suspend request fired while the lid was shut during a
# remote session and took the network down with it. Later the power button turned
# out to power the machine off (logind's HandlePowerKey default): a synthetic
# KEY_POWER press made logind log "Power key pressed short." and the machine went
# unreachable, so the button cannot wake it from anything. Mask every
# request-driven sleep path until the suspend/resume path is trusted, and never let
# the power button shut the machine down.
#
# Pair with: systemctl mask sleep.target suspend.target hibernate.target hybrid-sleep.target
# Revert: rm this file && systemctl unmask sleep.target suspend.target hibernate.target hybrid-sleep.target
[Login]
IdleAction=ignore
HandleLidSwitch=ignore
HandleLidSwitchExternalPower=ignore
HandleLidSwitchDocked=ignore
HandleSuspendKey=ignore
HandleSuspendKeyLongPress=ignore
HandlePowerKey=ignore
HandlePowerKeyLongPress=poweroff
